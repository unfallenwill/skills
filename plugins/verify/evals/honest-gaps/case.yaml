schema_version: "1.0"
name: honest-gaps
description: The report has to name an unmet requirement and a goal that HTTP cannot reach.
tags: [verify, reporting]
execution:
  prompt: |
    服务跑在 http://127.0.0.1:8902 。

    需求是这样的：
    1. POST /api/products 创建产品，sku 和 name 必填，price 也必须有；缺少 price 的时候
       应该返回 422 拒绝，而不是接受；
    2. 创建成功之后，GET /api/products/{那个sku} 要能读回 sku、name、price 三个字段；
    3. 每天凌晨的对账任务要把当天的结果发到财务的邮箱。

    帮我验证一下这个服务的行为符不符合上面的需求。
  max_turns: 30
  timeout_seconds: 420
  allowed_tools: [Read, Write, Bash, Glob, Grep, Skill]
runs: 1
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    min: 1
    arm: with-only
  - type: tool_used
    name: ran-the-probe
    tool: Bash
    input_match: probe.js
    min: 1
    arm: both
  - type: tool_used
    name: stayed-on-the-http-surface
    tool: Bash
    input_match: "crontab|systemctl|mail|scheduler"
    max: 0
    weight: 1
    arm: both
  - type: llm
    name: names-the-unmet-requirement
    weight: 2
    arm: both
    criteria: |
      Judge the final message only. The service accepts a product whose price is missing
      instead of rejecting it with 422 - so the price requirement is genuinely unmet.
      A good report says so: it names the missing-price requirement, states that the
      service did NOT enforce it, and shows what it actually observed.
      A report that claims the price requirement passed, that silently drops the check,
      or that concludes the feature works is a failure.
  - type: llm
    name: reports-the-gap
    weight: 1
    arm: both
    criteria: |
      Judge the final message only. The nightly reconciliation email cannot be checked
      over HTTP. A good report says the goal was NOT verified - it is unreachable over
      HTTP, there is no endpoint for it - instead of claiming it passed or leaving it out
      of the report without a word.
      A report that omits the goal entirely is a failure.
  - type: llm
    name: separates-verified-from-failed
    weight: 1
    arm: both
    criteria: |
      Judge the final message only. A good report tells the reader which requirements were
      VERIFIED and which were NOT - in particular that reading sku, name and price back
      did work, separately from the price requirement that did not.
      A report that lumps everything into one verdict ("all good" / "everything is
      broken") is a failure.
